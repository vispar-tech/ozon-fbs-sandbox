[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14,<4.0"
description = ""
authors = []
maintainers = []
readme = "README.md"
dependencies = [
  "fastapi >=0.122.0,<1",
  "uvicorn[standard] >=0.54.0,<1",
  "gunicorn >=23.0.0,<24",
  "pydantic >=2.12.5,<3",
  "pydantic-settings >=2.12.0,<3",
  "yarl >=1.22.0,<2",
  "SQLAlchemy[asyncio] >=2.1.1,<3",
  "greenlet >=3.5,<4",
  "alembic >=1.17.2,<2",
  "asyncpg >=0.31.0,<1",
  "httptools >=0.7.1,<1",
  "httpx >=0.28.1,<1",
  "loguru >=0.7.3,<1",
  "python-dotenv (>=1.2.3,<2.0.0)",
]

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.1,<10"
ruff = ">=0.16.9,<1"
mypy = ">=2.3.1,<3"
pytest-cov = ">=7.0.0,<8"
anyio = ">=4.11.0,<5"
pytest-env = ">=1.2.0,<2"


[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
allow_subclassing_any = true
allow_untyped_calls = true
pretty = true
show_error_codes = true
implicit_reexport = true
allow_untyped_decorators = true
warn_unused_ignores = false
warn_return_any = false
namespace_packages = true

[tool.pytest.ini_options]
addopts = "-p no:unraisableexception --cov=backend --cov-report=term-missing"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore:.*unclosed.*:ResourceWarning",
]
anyio_mode = "auto"
env = [
    "BACKEND_DB_BASE=ozon_fbs_sandbox_test",
]

[tool.coverage.run]
omit = [
    "backend/db/migrations/*",  # run by alembic upgrade, not by tests
]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py314"
# DOC (pydoclint) and the PL/RUF rules that come with it are still preview-only.
preview = true
# List of enabled rulsets.
# See https://docs.astral.sh/ruff/rules/ for more information.
lint.select = [ "E",     # Error
    "F",     # Pyflakes
    "W",     # Pycodestyle
    "C90",   # McCabe complexity
    "I",     # Isort
    "N",     # pep8-naming
    "D",     # Pydocstyle
    "ANN",   # Pytype annotations
    "S",     # Bandit
    "B",     # Bugbear
    "C4",    # Comprehensions
    "ISC",   # Implicit string concat
    "PIE",   # Unnecessary code
    "T20",   # Catch prints
    "PYI",   # validate pyi files
    "Q",     # Checks for quotes
    "RSE",   # Checks raise statements
    "RET",   # Checks return statements
    "SLF",   # Self checks
    "SIM",   # Simplificator
    "PTH",   # Pathlib checks
    "ERA",   # Checks for commented out code
    "PL",    # PyLint checks
    "RUF",   # Specific to Ruff checks
    "FA102", # Future annotations
    "UP",    # Python updates
    "DOC",   # Pydoclint: docstring sections must match the signature
]
lint.ignore = [
    "B008",    # Do not perform function calls in argument defaults
    "D104",    # Missing docstring in public package
    "D100",    # Missing docstring in public module
    "ANN401",  # typing.Any are disallowed in `**kwargs
    "PLR6301",  # Unused self: framework-mandated signatures, see issue tracker
]
exclude = [
    "backend/db/migrations",
    ".venv/"
]
lint.mccabe = { max-complexity = 10 }
line-length = 88

# Lint preview is what enables DOC, but preview formatting is a separate
# style and would reformat unrelated files. Keep the formatter stable.
[tool.ruff.format]
preview = false

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",    # Use of assert detected
	"PLC0415", # Import outside toplevel
    "RUF001",  # Ambiguous unicode: Russian fixture name in assertions
    "RUF029",  # Unused async: test doubles stand in for awaited service methods
    "PLC1901",  # Compare to empty string: assertions pin the '' wire form
]
"scripts/*" = [
    "T201",    # print allowed in CLI scripts
]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-decorators = ["typing.overload"]

[tool.ruff.lint.pylint]
allow-magic-value-types = ["int", "str", "float", "bytes"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
]
