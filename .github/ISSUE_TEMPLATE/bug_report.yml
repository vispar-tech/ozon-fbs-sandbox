name: Отчёт об ошибке
description: Что-то сломано или работает не так, как ожидается.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: Что произошло и что ожидалось?
      description: По одному предложению на каждое достаточно.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Область
      description: Какая часть проекта затронута?
      options:
        - Бэкенд (FastAPI)
        - Фронтенд (React/Vite)
        - Docker / CI
        - Другое
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия
      description: SHA коммита или тег релиза. "latest" не является версией.
      placeholder: например 59f7d39
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Окружение
      description: ОС и версии Python/Node/Docker, если это важно.
      placeholder: macOS 14, Python 3.14, Node 26.9.0, Docker 27
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Логи или вывод ошибки
      render: shell
    validations:
      required: false
