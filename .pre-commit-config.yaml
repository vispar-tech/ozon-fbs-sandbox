---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# Конфиг живёт в корне репо — `pre-commit install` из git-root работает штатно.
# Хуки запускаются из любого cwd (git-root, backend/, CI): entry находит backend/
# через `git rev-parse --show-toplevel`.
repos:
    - repo: local
      hooks:

           - id: ruff-format
             name: Format with Ruff
             entry: sh -c 'cd "$(git rev-parse --show-toplevel)/backend" && poetry run ruff format "$@"' --
             language: system
             pass_filenames: false
             always_run: true

           - id: ruff
             name: Check with Ruff
             entry: sh -c 'cd "$(git rev-parse --show-toplevel)/backend" && poetry run ruff check backend tests "$@"' --
             language: system
             pass_filenames: false
             always_run: true
             args: ["--fix"]

           - id: mypy
             name: Validate types with MyPy
             entry: sh -c 'cd "$(git rev-parse --show-toplevel)/backend" && poetry run mypy "$@"' --
             language: system
             pass_filenames: false
             always_run: true
             args:
               - "backend"
               - "tests"